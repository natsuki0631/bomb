<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>仕分けゲーム スマホ版</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:#111d30;color:white;font-family:system-ui;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}header{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 6px;flex:none;font-size:15px}#life{font-size:34px;color:#ff6c85;letter-spacing:3px}#field{flex:1;min-height:0;width:calc(100% - 12px);max-width:640px;margin:auto;position:relative;overflow:hidden;touch-action:none;background:#233550;border:2px solid #526984;border-radius:16px}.box{position:absolute;top:50%;transform:translate(-50%,-50%);width:38%;height:140px;border:5px dashed;border-radius:18px;display:grid;place-items:center;pointer-events:none;font-weight:bold}.rbox{left:29%;color:#ff879a;background:#ff405018}.bbox{left:71%;color:#7ac6ff;background:#258eff18}.ball{position:absolute;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:bold;color:white;border:3px solid #ffffffb0;box-shadow:inset -8px -10px 16px #0005,inset 5px 5px 12px #fff4,0 8px 16px #0008;touch-action:none}.ball:before{content:'';position:absolute;inset:-10px;border-radius:50%}.red{background:#dc3754}.blue{background:#2180d0}.held{z-index:10}.urgent{outline:4px solid #ffe277}#overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#101b30eb;text-align:center;padding:18px}#overlay.hidden{display:none}h1{font-size:25px}p{line-height:1.8;font-size:15px}button{min-height:56px;min-width:180px;background:#ffe279;color:#16243a;border:0;border-radius:14px;font-size:20px;font-weight:bold;touch-action:manipulation}footer{text-align:center;padding:10px 4px;font-size:12px;flex:none;color:#c7d4e8}.boom{position:absolute;font-size:65px;pointer-events:none;transform:translate(-50%,-50%);animation:blast .6s forwards}@keyframes blast{to{opacity:0;transform:translate(-50%,-50%) scale(2)}}@media(orientation:landscape) and (max-height:500px){header{padding:4px}#life{font-size:27px}footer{padding:4px}.box{height:105px;width:28%}.rbox{left:33%}.bbox{left:67%}h1{font-size:20px;margin:5px}p{font-size:12px;margin:5px}}</style><header><span>得点 <b id="score">0</b></span><span>残り <b id="time">60</b>秒</span><span id="life">♥♥♥</span></header><main id="field"><div class="box rbox" data-c="red">赤の箱</div><div class="box bbox" data-c="blue">青の箱</div><div id="overlay"><section><h1 id="title">仕分けゲーム スマホ版</h1><p id="msg">指で丸をつかみ、同じ色の箱で離そう！<br>丸の時間がゼロになると爆発。<br>3回爆発で終了。60秒耐えればクリア！</p><button id="start">スタート</button></section></div></main><footer id="hint">丸の中心を箱に入れて、指を離してください</footer><script>
const $=s=>document.querySelector(s),field=$('#field'),overlay=$('#overlay'),S=76;let balls=[],active=false,score=0,life=3,start=0,last=0,next=0,raf=0;
function paint(b){b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'}function remove(b){b.el.remove();balls=balls.filter(v=>v!==b)}function end(win){active=false;overlay.classList.remove('hidden');$('#title').textContent=win?'60秒クリア！':'ゲームオーバー';$('#msg').textContent='得点 '+score+'点 ／ '+score/10+'個を仕分け';$('#start').textContent='もう一度遊ぶ'}function boom(b){const el=document.createElement('div');el.className='boom';el.textContent='💥';el.style.left=b.x+S/2+'px';el.style.top=b.y+S/2+'px';field.append(el);setTimeout(()=>el.remove(),650);remove(b);life--;$('#life').textContent='♥'.repeat(life)+'♡'.repeat(3-life);if(life===0)end(false)}
function spawn(t,now){let w=field.clientWidth,h=field.clientHeight,x=Math.random()*Math.max(0,w-S),y=Math.random()*Math.max(0,h-S),vx=0,vy=0;const side=Math.floor(Math.random()*4),speed=12+18*t/60;if(side===0){x=2;vx=speed}else if(side===1){x=w-S-2;vx=-speed}else if(side===2){y=2;vy=speed}else{y=h-S-2;vy=-speed}const c=Math.random()<.5?'red':'blue',el=document.createElement('div');el.className='ball '+c;const b={el,c,x,y,vx,vy,mx:0,my:0,held:false,id:null,stamp:0,deadline:now+(5-3*t/60)*1000};balls.push(b);field.append(el);paint(b);
el.onpointerdown=e=>{if(!active||b.held)return;e.preventDefault();b.held=true;b.id=e.pointerId;b.mx=b.my=0;b.stamp=performance.now();const r=field.getBoundingClientRect();b.dx=e.clientX-r.left-field.clientLeft-b.x;b.dy=e.clientY-r.top-field.clientTop-b.y;el.classList.add('held');el.setPointerCapture(e.pointerId)};
el.onpointermove=e=>{if(!active||!b.held||b.id!==e.pointerId)return;e.preventDefault();const r=field.getBoundingClientRect(),x=Math.max(0,Math.min(field.clientWidth-S,e.clientX-r.left-field.clientLeft-b.dx)),y=Math.max(0,Math.min(field.clientHeight-S,e.clientY-r.top-field.clientTop-b.dy)),now=performance.now(),dt=Math.max(.008,(now-b.stamp)/1000);b.mx=.6*b.mx+.4*Math.max(-600,Math.min(600,(x-b.x)/dt));b.my=.6*b.my+.4*Math.max(-600,Math.min(600,(y-b.y)/dt));b.x=x;b.y=y;b.stamp=now;paint(b)};
el.onpointerup=e=>{if(!b.held||b.id!==e.pointerId)return;b.held=false;el.classList.remove('held');if(!active||!balls.includes(b))return;const now=performance.now();if(now>=b.deadline){boom(b);return}if(now-b.stamp>100)b.mx=b.my=0;const r=el.getBoundingClientRect(),x=r.left+S/2,y=r.top+S/2;for(const box of document.querySelectorAll('.box')){const a=box.getBoundingClientRect();if(x>=a.left&&x<=a.right&&y>=a.top&&y<=a.bottom){if(box.dataset.c===b.c){score+=10;$('#score').textContent=score;remove(b)}else $('#hint').textContent='同じ色の箱へ入れてください！';break}}};el.onpointercancel=()=>{b.held=false;b.mx=b.my=0;el.classList.remove('held')};}
function tick(now){if(!active)return;const t=(now-start)/1000,dt=Math.min(.04,(now-last)/1000);last=now;$('#time').textContent=Math.max(0,Math.ceil(60-t));if(t>=60){end(true);return}if(now>=next){spawn(t,now);next=now+(1.5-1.05*t/60)*1000}for(const b of [...balls]){if(!active)break;const left=(b.deadline-now)/1000;if(left<=0){boom(b);continue}b.el.textContent=left.toFixed(1);b.el.classList.toggle('urgent',left<1);if(!b.held){b.x+=(b.vx+b.mx)*dt;b.y+=(b.vy+b.my)*dt;const d=Math.exp(-3.2*dt);b.mx*=d;b.my*=d;const w=Math.max(0,field.clientWidth-S),h=Math.max(0,field.clientHeight-S);if(b.x<0||b.x>w){b.x=Math.max(0,Math.min(w,b.x));b.vx*=-1;b.mx*=-.35}if(b.y<0||b.y>h){b.y=Math.max(0,Math.min(h,b.y));b.vy*=-1;b.my*=-.35}paint(b)}}if(active)raf=requestAnimationFrame(tick)}
$('#start').onclick=()=>{cancelAnimationFrame(raf);balls.forEach(b=>b.el.remove());field.querySelectorAll('.boom').forEach(e=>e.remove());balls=[];score=0;life=3;$('#score').textContent=0;$('#time').textContent=60;$('#life').textContent='♥♥♥';$('#hint').textContent='丸の中心を箱に入れて、指を離してください';overlay.classList.add('hidden');active=true;start=last=next=performance.now();raf=requestAnimationFrame(tick)};
</script></html>
